<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#11162f" />
  <title>Tony Soprano Thanksgiving</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="shell" aria-label="Tony Soprano Thanksgiving game">
    <canvas id="game" width="640" height="360" aria-label="Game canvas"></canvas>

    <div id="touchControls" aria-hidden="true">
      <div id="stickZone">
        <div id="stickBase"><div id="stickNub"></div></div>
      </div>
      <div id="touchButtons">
        <button id="btnB" type="button">B</button>
        <button id="btnA" type="button">A</button>
      </div>
      <button id="btnS" type="button" aria-label="Run — hold to sprint">RUN</button>
      <button id="btnR" type="button" aria-label="Replay">↻</button>
      <button id="btnF" type="button" aria-label="Punch">F</button>
    </div>

    <div id="rotateHint">🔄 rotate your phone sideways for the full wide world — tap to dismiss</div>
    <div id="topActions">
      <button id="menuBtn" type="button" aria-label="Menu">☰ MENU</button>
      <button id="muteBtn" type="button" aria-label="Toggle sound">Sound</button>
      <button id="helpBtn" type="button" aria-label="Show controls">?</button>
    </div>
  </main>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
